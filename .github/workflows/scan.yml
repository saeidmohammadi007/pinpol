name: LBank ADX-MACD scanner

on:
  workflow_dispatch:        # فقط اجرای دستی از Actions ← Run workflow

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # کراس MACD صعودی: در ۱ تا ۳ کندل اخیر (آخرین کندل کامل = #1)
          MACD_LOOKBACK: "3"

          # مثلث قرمز ADX (shortE): در ۱ تا ۲۰ کندل اخیر
          # بدون قید ترتیب نسبت به کراس — می‌تواند قبل، بعد یا هم‌زمان باشد
          LOOKBACK: "20"

          # ارسال خلاصه آماری حتی وقتی هیچ سیگنالی پیدا نشد (0 = خاموش)
          NOTIFY_EMPTY: "1"

          # تعداد روزهای داده ۱ساعته دریافتی از Yahoo
          RANGE_DAYS: "60"
